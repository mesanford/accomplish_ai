<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6a2e" />
    <title>Offline - Forthright</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #f5f3ec; color: #25301a; font: 17px/1.5 'Source Sans 3', system-ui, sans-serif; }
      main { max-width: 28rem; text-align: center; }
      h1 { margin: 0 0 8px; font: 700 28px/1.2 'Zilla Slab', Georgia, serif; color: #4f6a2e; }
      p { margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 8px; background: #4f6a2e; color: #fff; }
      @media (prefers-color-scheme: dark) { body { background: #1d2315; color: #ecebe2; } h1 { color: #a8c47a; } button { background: #a8c47a; color: #1d2315; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Forthright could not reach the internet. Pages you opened recently may still load. Try again when you have a signal.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
