<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6a2e" />
    <title>Forthright: advancement planning for Scouts BSA troops</title>
    <meta
      name="description"
      content="Forthright helps Scouts BSA troops plan rank advancement, run blue cards and counselors, and hand advancement to Scoutbook with a report. In a pilot with a few troops."
    />
    <!-- These describe the home page. The script below removes the two address tags on every other page, except troop sites (/s/), whose address tags the server writes. -->
    <link rel="canonical" href="https://forthrightapp.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forthright" />
    <meta property="og:title" content="Forthright: advancement planning for Scouts BSA troops" />
    <meta
      property="og:description"
      content="Plan each rank, run blue cards and counselors, and hand advancement to Scoutbook with a report. In a pilot with a few troops."
    />
    <meta property="og:url" content="https://forthrightapp.com/" />
    <meta property="og:image" content="https://forthrightapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Forthright: advancement planning for Scouts BSA troops" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://forthrightapp.com/og-image.png" />
    <script>
      if (location.pathname !== '/' && location.pathname.indexOf('/s/') !== 0) {
        document.querySelectorAll('link[rel="canonical"], meta[property="og:url"]').forEach(function (el) {
          el.remove();
        });
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Installed on an iPhone or iPad (Share > Add to Home Screen): open full screen, with this name under the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forthright" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
